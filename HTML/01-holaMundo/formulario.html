<!DOCTYPE html>
<html lang="">

    <main>
      <h1>Formulario</h1>
      <form>
        <div>
          Nombre: <input type="text" required />
        </div>
        <div>
          Edad: <input type="number" required />
        </div>
        <div>
          <input type="checkbox" checked /> ¿Está inscrito?
        </div>
        <div>
          Comentarios:
        </div>
        <div>
          <textarea> </textarea>
        </div>
        <div>
          Color:
          <select>
            <option>Azul</option>
            <option selected>Rojo</option>
            <option>Verde</option>
          </select>
        <div>
          Países:
          <select multiple>
            <option>Canadá</option>
            <option>Estados Unidos</option>
            <option>México</option>

        </div>
        </div>

        </div>

    </main>
    <footer></footer>
  </body>
